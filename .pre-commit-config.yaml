#############################################################################################
# pre-commit is a "framework for managing and maintaining multi-language pre-commit hooks"  #
# see https://pre-commit.com/#intro for an introduction to pre-commit                       #
#                                                                                           #
# - pre-commit hooks are run on staged files just before a commit or a push                 #
# - to run a given hook on any file at any time, run the following on the command line:     #
#    pre-commit run <HOOK_ID> --files <FILE1> <FILE2> ..., e.g.,                            #
#    pre-commit run ruff --files mal_formatted_file.py                                       #
#############################################################################################

# Never lint/format the generated protobuf/gRPC stubs.
exclude: '(.*_pb2\.pyi?$|.*_pb2_grpc\.py$)'

fail_fast: false
# "fail_fast: false" means pre-commit continues to run hooks after the first failure

repos:

  # Markdown linting. MD013 (line-length) and MD033 (inline HTML) are disabled in
  # .markdownlint-cli2.yaml because the docs embed <p>/<code> and long lines.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2

  # Ruff replaces flake8 (lint) AND black + autopep8 (format). Config lives in pyproject.toml
  # ([tool.ruff]); generated *_pb2* stubs are excluded via the global exclude above.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check  # Lint (replaces flake8); `ruff` is a legacy alias since ruff-pre-commit v0.16
        args: [ --fix ]
      - id: ruff-format  # Format (replaces black + autopep8)

  # mypy from the project's own uv environment, so it sees the installed runtime deps and the
  # types-* stubs. The old mirrors-mypy block used `language: system`, which ran a bare `mypy` that
  # is on no PATH unless a venv happens to be activated ("Executable `mypy` not found"), and its
  # `exclude: ondewo` skipped the package itself. Same command as `make mypy` and CI.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --no-sync mypy ondewo tests
        language: system
        pass_filenames: false
        types: [ python ]
        require_serial: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files  # Prevent giant files from being committed
        args: [ maxkb=1024 ]
      - id: check-ast  # Check whether files parse as valid python
      - id: check-json  # Attempt to load json files to verify syntax
      - id: check-xml  # Attempt to load xml files to verify syntax
      - id: check-yaml  # Attempt to load yaml files to verify syntax
      - id: check-merge-conflict  # Check for files that contain merge conflict strings
      - id: check-symlinks  # Check for broken symlinks
      - id: debug-statements  # Check for debugger imports and py37+ breakpoint() calls
      - id: detect-private-key  # Check for the existence of private keys
      - id: check-executables-have-shebangs
      - id: trailing-whitespace  # Trim trailing whitespace.
      - id: end-of-file-fixer # makes sure files end in a newline and only a newline
      - id: pretty-format-json # autoformat json files (e.g. sorting keys)
        args: [ --autofix, --indent=4 ]
      - id: name-tests-test # name pytest files correctly
        args: [ --pytest-test-first ]
      - id: check-toml  # Attempt to load toml files (pyproject.toml) to verify syntax
      - id: no-commit-to-branch  # Never commit straight onto master
        args: [ --branch, master ]

  # Keep uv.lock in sync with pyproject.toml.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.23
    hooks:
      - id: uv-lock

  # Order matters on the commit-msg stage: the conventional check runs FIRST on the subject the
  # author typed, giticket SECOND prepends `[<TICKET>] ` on ticket branches. The check is upstream
  # conventional-pre-commit (pinned as a dependency, same rules) behind a thin wrapper that strips
  # ONE leading `[<TICKET>] ` first, because upstream rejects any subject that does not start with a
  # type: without it an already prefixed message (`git commit --amend`, a hand-written prefix) only
  # got through with --no-verify, which skips every other hook too. Copied from ondewo-vtsi.
  - repo: local
    hooks:
      - id: conventional-pre-commit
        name: Conventional Commit
        entry: python scripts/hooks/conventional_commit_msg.py
        language: python
        additional_dependencies: [ conventional-pre-commit==4.4.0 ]
        stages: [ commit-msg ]

  - repo: https://github.com/milin/giticket
    rev: v1.92  # same commit as the '1.92' tag autoupdate picks; v1.92 matches ondewo-sip and ondewo-vtsi
    hooks:
      - id: giticket  # Prepend the commit message with the JIRA ticket
        # giticket uses this ONE regex twice: to find the ticket in the branch name, and to decide the
        # message "already has a ticket" -- it bails if the regex matches ANY LINE of the message, body
        # included. Unanchored, a body that merely MENTIONED a ticket branch silently cost the commit its
        # prefix, and an already prefixed subject was not recognised, so an amend was prefixed twice.
        # Anchored at the start of the line it matches only a whole branch name or a line that STARTS
        # with `[<TICKET>] `; the `Merge <branch|tag|...> ` alternative keeps merge commits unprefixed.
        # Same value as ondewo-sip and ondewo-vtsi; pinned by tests/test_giticket_regex.py.
        args:
          - "--regex=^(?:Merge (?:branch|branches|remote-tracking branch|remote-tracking branches|tag|commit|pull request) |(?:(?:feature|bugfix|support|hotfix)/)?\\[?([A-Z]{3}[0-9]{3}-[0-9]{1,5})(?:[_-][\\w-]+$|\\] ))"
          - "--format=[{ticket}] {commit_msg}"
          - "--mode=regex_match"
