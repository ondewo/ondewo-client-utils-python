[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ondewo-client-utils"
# The version is the single source of truth in ondewo/version.py (read at build
# time). Keeping it dynamic preserves the repo's existing release flow: the
# Makefile derives ONDEWO_PACKAGE_VERSION from ondewo/version.py, so there is no
# second place to bump / no drift risk.
dynamic = ["version"]
description = "This library contains utilities and base classes for gRPC clients."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "ONDEWO GmbH", email = "office@ondewo.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
# Verbatim from requirements.txt (commented-out deps intentionally omitted).
dependencies = [
    "dataclasses-json",
    "googleapis-common-protos>=1.63.2",
    "grpcio>=1.65.5",
    "grpcio-reflection>=1.65.5",
    "grpcio-tools>=1.65.5",
    "regex",
]

[project.optional-dependencies]
# From requirements-dev.txt, with flake8 swapped for ruff. pytest-cov and
# pytest-asyncio were already present.
dev = [
    "Cython>=3.0.0",
    "ruff",
    "mypy>=1.11.0",
    "pre-commit",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "types-mock",
    "types-protobuf",
    "types-pytz",
    "types-requests",
    "types-setuptools",
    "types-toml",
]

[project.urls]
Homepage = "https://github.com/ondewo/ondewo-client-utils-python"
Repository = "https://github.com/ondewo/ondewo-client-utils-python"

# ---------------------------------------------------------------------------
# setuptools: package discovery + package data + dynamic version
# Equivalent to the old setup.py:
#   version = ondewo.version.__version__
#   packages = find_packages(include=['ondewo*'])
#   include_package_data=True (MANIFEST.in)
# ---------------------------------------------------------------------------
[tool.setuptools.dynamic]
version = { attr = "ondewo.version.__version__" }

[tool.setuptools.packages.find]
include = ["ondewo", "ondewo.*"]

[tool.setuptools.package-data]
"ondewo.utils" = ["py.typed", "*.pyi"]

# ---------------------------------------------------------------------------
# Ruff  (replaces flake8: old .flake8 was `ignore = E501, W503`, line-length 120)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py39"
# This repo ships NO generated protobuf/gRPC stubs, so these globs match nothing
# today; they are kept for consistency with the other ondewo clients.
extend-exclude = [
    "*_pb2.py",
    "*_pb2.pyi",
    "*_pb2_grpc.py",
]

[tool.ruff.lint]
# pycodestyle (E/W) + pyflakes (F) == the flake8 default rule set.
# The old .flake8 ignored E501 (line-length not enforced) and W503 (line break
# before binary operator, which ruff does not implement).
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.format]
# Supersedes the old autopep8 hook.
quote-style = "double"

# ---------------------------------------------------------------------------
# Mypy  (translated faithfully from mypy.ini)
# ---------------------------------------------------------------------------
[tool.mypy]
# The package supports Python >=3.9, but current mypy no longer accepts
# python_version = 3.9 ("must be 3.10 or higher"); the library uses no
# 3.10-only syntax, so 3.10 does not weaken checks.
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

# Third-party packages without (complete) type stubs.
[[tool.mypy.overrides]]
module = [
    "setuptools",
    "Cython.*",
    "grpc",
    "regex",
    "google",
    "google.protobuf.struct_pb2",
]
ignore_missing_imports = true
