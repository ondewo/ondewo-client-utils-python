name: tests

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege: the job only reads the repository.
permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the release images use; downstream (ondewo-vtsi) consumes the package on 3.14,
        # where instance __annotations__ no longer exist (PEP 649) and disconnect() used to break.
        python-version: ["3.12", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install package + dev/test dependencies (from uv.lock)
        run: uv sync --extra dev --frozen

      - name: Ruff lint (replaces flake8)
        run: uv run --frozen ruff check .

      - name: Ruff format check
        run: uv run --frozen ruff format --check .

      - name: Mypy type check (package and tests)
        run: uv run --frozen mypy ondewo tests

      # The 100% coverage gate for the hand-written surface (ondewo.utils) is
      # configured in pytest.ini (--cov=ondewo.utils --cov-fail-under=100) and
      # .coveragerc (branch coverage, fail_under = 100, omit version.py).
      - name: Unit tests + 100% coverage gate (config in pytest.ini / .coveragerc)
        run: uv run --frozen pytest

      # uv.lock resolves protobuf 6.x, while ondewo-csi, ondewo-sip and ondewo-vtsi run 7.x. 4.0.0 shipped
      # with a <7 cap that made it uninstallable there, so the 7.x line is exercised here too.
      - name: Unit tests on protobuf 7 (the line ondewo-csi, -sip and -vtsi run)
        run: uv run --frozen --with "protobuf>=7.35.1,<8" --with "grpcio>=1.83.0" --with "grpcio-tools>=1.83.0" --with "grpcio-reflection>=1.83.0" pytest

      - name: Dependency audit (pip-audit over the locked set, blocking)
        run: make security_audit
