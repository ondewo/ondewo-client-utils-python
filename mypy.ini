# Global options:

[mypy]
# The package supports Python >=3.9, but current mypy releases no longer accept
# python_version = 3.9 ("must be 3.10 or higher"), so 3.10 is the lowest target
# available. The library uses no 3.10-only syntax, so this does not weaken checks.
python_version = 3.10
warn_return_any = True
warn_unused_configs = True

# Per-module options:
[mypy-setuptools]
ignore_missing_imports = True
[mypy-Cython.*]
ignore_missing_imports = True
[mypy-grpc]
ignore_missing_imports = True
[mypy-regex]
ignore_missing_imports = True
[mypy-google]
ignore_missing_imports = True

[mypy-google.protobuf.struct_pb2]
ignore_missing_imports = True
